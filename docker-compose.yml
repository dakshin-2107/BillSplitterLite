services:
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-stack-server
      --appendonly yes
      --appendfsync everysec
      --save 60 1
      --save 300 100
      --save 3600 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      REDIS_URI: "redis:${REDIS_PORT:-6379}"
      BASE_URL: "${BASE_URL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      ALLOW_DEBUG_LOGS: "${ALLOW_DEBUG_LOGS:-true}"
      ALLOW_INFO_LOGS: "${ALLOW_INFO_LOGS:-true}"
      ALLOW_PANIC_LOGS: "${ALLOW_PANIC_LOGS:-true}"
      EXPOSE_EXAMPLE_ENDPOINT: "${EXPOSE_EXAMPLE_ENDPOINT:-false}"
      AI_PROMPT: "${AI_PROMPT:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_URL: "${VITE_BASE_URL:-http://localhost:8080}"
        VITE_WS_BASE_URL: "${VITE_WS_BASE_URL:-ws://localhost:8080}"
        VITE_BASE_URL_HOME_ENDPOINT: "home"
        VITE_CLOSE_ENDPOINT: "close"
        VITE_WS_BASE_URL_ACTIONS_ENDPOINT: "ws-actions"
        VITE_SITE_TITLE: "Splitzy"
        VITE_ABOUT_ME_URI: "${VITE_ABOUT_ME_URI:-}"
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
